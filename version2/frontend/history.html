<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D.I.S.H.A. — Session History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<!-- Inline auth guard -->
<script>
  (function () {
    var token = localStorage.getItem("disha_token");
    var role  = localStorage.getItem("disha_role");
    if (!token) { window.location.replace("login.html"); }
    else if (role === "admin") { window.location.replace("admin.html"); }
  })();
</script>

<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>D.I.S.H.A.</h1>
      <p>Safety Assistant</p>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html">
        <span class="nav-icon">🎥</span> Live Monitor
      </a>
      <a class="nav-item active" href="history.html">
        <span class="nav-icon">📋</span> Session History
      </a>
      <a class="nav-item admin-only" href="admin.html">
        <span class="nav-icon">⚙️</span> Admin
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="user-avatar" id="sidebarAvatar">D</div>
        <div class="user-info">
          <div class="user-name" id="sidebarUserName">Driver</div>
          <div class="user-role" id="sidebarUserRole">user</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-full" id="btnLogout" style="margin-top:.6rem;font-size:.8rem">
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <div class="topbar">
      <h2>Session History</h2>
    </div>

    <div class="page-content">
      <div class="card">
        <div class="card-title">Your Monitoring Sessions</div>

        <!-- Empty state -->
        <div class="empty-state hidden" id="emptyState">
          <span class="empty-icon">📋</span>
          No sessions recorded yet. Start monitoring to create one.
        </div>

        <div style="overflow-x:auto">
          <table class="sessions-table">
            <thead>
              <tr>
                <th>Date / Time</th>
                <th>Driver</th>
                <th>Duration</th>
                <th>Alerts</th>
                <th>Max Risk</th>
                <th>Events</th>
              </tr>
            </thead>
            <tbody id="sessionsBody">
              <tr>
                <td colspan="6" style="text-align:center;color:var(--muted);padding:2rem">
                  Loading…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div><!-- /app-shell -->

<!-- Events modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" style="max-width:560px">
    <h3 id="modalTitle">Events</h3>
    <div id="eventsList" style="max-height:400px;overflow-y:auto;margin-top:.5rem"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCloseModal">Close</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/history.js"></script>
</body>
</html>
